<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nam Hải Oracle - Master Detective</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: #e94560; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { background: #16213e; padding: 20px; border-radius: 15px; box-shadow: 0 0 20px rgba(0,0,0,0.5); max-width: 500px; width: 100%; }
        h1 { text-align: center; color: #0f3460; background: #e94560; padding: 10px; border-radius: 10px; }
        label { display: block; margin-top: 10px; color: #0f3460; font-weight: bold; color: #fff; }
        input, textarea, select { width: 100%; padding: 10px; margin-top: 5px; border-radius: 5px; border: none; box-sizing: border-box; }
        button { width: 100%; padding: 15px; margin-top: 20px; background: #e94560; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 1.1em; }
        button:hover { background: #ff4d6d; }
        #results, #final { margin-top: 20px; padding: 15px; border-radius: 10px; white-space: pre-wrap; line-height: 1.6; }
        #results { color: #00d2ff; font-style: italic; }
        #final { background: #0f3460; color: #fff; border-left: 5px solid #e94560; display: none; }
        .input-group { background: #1a1a2e; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>NAM HAI ORACLE</h1>
    
    <div class="input-group">
        <label>Tên của bạn (hoặc Biệt danh):</label>
        <input type="text" id="name" placeholder="Ví dụ: Anh Long">
        
        <label>Bạn đang tìm đồ vật gì?</label>
        <input type="text" id="question" placeholder="Ví dụ: Chìa khóa xe, ví tiền...">
    </div>

    <div class="input-group">
        <label>Kể lại ngắn gọn sự việc:</label>
        <textarea id="story" rows="3" placeholder="Ví dụ: Tôi đi xe về, đặt ví xuống rồi đi tắm..."></textarea>
    </div>

    <div class="input-group">
        <label>Đồ vật/Con người cuối cùng bạn thấy?</label>
        <input type="text" id="last-seen" placeholder="Ví dụ: Thấy vợ, hoặc cái túi xách...">
    </div>

    <div class="input-group">
        <label>Thời điểm xảy ra:</label>
        <select id="time-period">
            <option value="Sáng">Sáng (Ánh sáng rõ)</option>
            <option value="Trưa">Trưa (Ánh sáng gắt)</option>
            <option value="Chiều">Chiều (Ánh sáng yếu)</option>
            <option value="Đêm">Đêm (Bóng tối/Đèn)</option>
        </select>

        <label>Thói quen của bạn:</label>
        <select id="user-habit">
            <option value="Nguyên tắc">Cẩn thận, nguyên tắc</option>
            <option value="Hay quên">Hay quên, vội vã</option>
            <option value="Xao lãng">Đang lo lắng, xao lãng</option>
        </select>
    </div>

    <button onclick="startSearch()">BẮT ĐẦU TRUY VẾT</button>

    <div id="results"></div>
    <div id="final"></div>
</div>

<script>
// --- 1. DỮ LIỆU WISDOM MAP (HỆ THỐNG CƠ CHẾ) ---
const WisdomMap = {
    0: { place: "Lối đi, hành lang, cửa ra vào", state: "Rơi rớt khi di chuyển", mechanism: "Sự thay đổi không gian đột ngột khiến vật rơi khỏi tầm mắt." },
    1: { place: "Bàn làm việc, nơi có đồ điện tử", state: "Nằm trên bề mặt phẳng", mechanism: "Bạn đặt xuống để rảnh tay thực hiện thao tác khác." },
    2: { place: "Trong túi, vật chứa kín, ngăn kéo", state: "Bị kẹp hoặc che khuất", mechanism: "Vật bị bao bọc quá kỹ hoặc bị vật khác đè lên." },
    4: { place: "Kệ tủ, nơi có tính trật tự", state: "Bị đè dưới vật nặng hơn", mechanism: "Sự sắp xếp nhất thời đã che lấp vật phẩm." },
    6: { place: "Không gian chung, gần người khác", state: "Nằm gần đồ người khác", mechanism: "Xao lãng do tương tác xã hội hoặc người thứ hai." },
    7: { place: "Phương tiện, hộc xe, túi khoác", state: "Kẹt trong khe/góc khuất", mechanism: "Rung động vật lý đã đẩy vật rời khỏi vị trí." },
    9: { place: "Góc tường, gầm tủ, nơi tối", state: "Bị bóng tối che khuất", mechanism: "Vật trượt khỏi bề mặt và rơi vào điểm chết không gian." },
    12: { place: "Giá treo, móc áo, nếp vải", state: "Đang treo lơ lửng", mechanism: "Vật vẫn kẹt trong lớp áo quần bạn vừa tháo bỏ." },
    14: { place: "Phòng tắm, bồn rửa", state: "Trơn trượt/Gần nước", mechanism: "Vội vã trong sinh hoạt làm mất ma sát của vật." },
    15: { place: "Vị trí bừa bộn", state: "Bị cầm nhầm/giấu", mechanism: "Tác động ngoại cảnh hoặc người khác dịch chuyển." },
    18: { place: "Điểm mù ngay trước mắt", state: "Bị ảo giác che mờ", mechanism: "Tâm trí mặc định chỗ đó không có, khiến mắt tự bỏ qua." }
};

// --- 2. HÀM BỔ TRỢ ---
function normalize(str) {
    return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

function getSeed(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
        hash = ((hash << 5) - hash) + str.charCodeAt(i);
        hash |= 0;
    }
    return Math.abs(hash);
}

function typeEffect(element, text) {
    element.innerHTML = "";
    element.style.display = "block";
    let i = 0;
    let timer = setInterval(() => {
        if (i < text.length) {
            element.innerHTML += text.charAt(i);
            i++;
        } else {
            clearInterval(timer);
        }
    }, 20);
}

// --- 3. THE INVESTIGATION ENGINE (LOGIC CHÍNH) ---
function startSearch() {
    const name = document.getElementById("name").value;
    const story = normalize(document.getElementById("story").value);
    const q = normalize(document.getElementById("question").value);
    const lastSeen = normalize(document.getElementById("last-seen").value);
    const habit = document.getElementById("user-habit").value;
    const time = document.getElementById("time-period").value;

    if(!story || !q) { alert("Vui lòng nhập câu chuyện và đồ vật cần tìm!"); return; }

    document.getElementById("results").innerHTML = "⚡ Đang tái lập hiện trường và tính toán tọa độ...";
    document.getElementById("final").style.display = "none";

    // A. PHÁT HIỆN PHỦ ĐỊNH
    let isNegated = story.includes("khong") || story.includes("chua");

    // B. CHẤM ĐIỂM ĐỊNH MỆNH
    let scores = new Array(22).fill(0);
    const actionMap = [
        {id: 12, keys: ["coi", "thao", "thay", "lot"]},
        {id: 1, keys: ["dat", "de", "bo", "cam"]},
        {id: 7, keys: ["di", "xe", "den", "chay"]},
        {id: 14, keys: ["tam", "rua", "giat"]}
    ];

    actionMap.forEach(a => {
        if (a.keys.some(k => story.includes(k))) {
            scores[a.id] += isNegated ? -30 : 25;
        }
    });

    // C. CONTEXT & ANCHOR
    if (lastSeen.includes("nguoi") || lastSeen.includes("ban") || lastSeen.includes("ai")) {
        scores[6] += 15;
        if (lastSeen.includes("dua") || lastSeen.includes("giu")) scores[15] += 20;
    }
    if (lastSeen.includes("tui") || lastSeen.includes("vi") || lastSeen.includes("hop")) {
        scores[2] += 25;
    }

    // D. HABIT & TIME CROSSING
    if (habit === "Hay quên") scores[0] += 10, scores[18] += 15;
    if (habit === "Nguyên tắc") scores[4] += 20;
    if (time === "Đêm") scores[9] += 10, scores[18] += 10;

    // E. CHỌN KẾT QUẢ CAO NHẤT
    let sorted = scores.map((s, i) => ({i, s}))
                       .sort((a, b) => b.s - a.s)
                       .filter(x => WisdomMap[x.i]);

    let picked = sorted.slice(0, 2);
    let seed = getSeed(story + lastSeen + name);
    let confidence = Math.min(98, 60 + (picked[0].s + (seed % 15)));

    setTimeout(() => {
        const m1 = WisdomMap[picked[0].i];
        let negationMsg = isNegated ? "⚠️ Phát hiện logic phủ định: Các khu vực bạn khẳng định 'không' liên quan đã bị loại bỏ.\n" : "";
        
        let finalOutput = `🔮 **NAM HAI ORACLE - INVESTIGATION MODE**\n\n` +
            `📍 **Tái lập hiện trường:** ${negationMsg}` +
            `Dựa trên điểm neo "${document.getElementById("last-seen").value}", hệ thống đã bóc tách được cơ chế thất lạc.\n\n` +
            `⚠️ **Độ tin cậy: ${confidence.toFixed(0)}%**\n\n` +
            `1️⃣ **Tọa độ trọng tâm:** Vật phẩm nằm ở **${m1.place}**.\n` +
            `- **Trạng thái:** ${m1.state}.\n` +
            `- **Cơ chế:** ${m1.mechanism}\n\n` +
            `🌈 **Chỉ dẫn sắc khí:** Trong bối cảnh buổi **${time}**, hãy tìm ở hướng **${habit === "Hay quên" ? "dưới thấp hoặc các góc khuất" : "ngang tầm mắt"}**.\n\n` +
            `💡 **Lời khuyên:** Đừng tìm đồ vật, hãy tìm lại cái **Cơ chế** mà hệ thống vừa nêu. Khi bạn hiểu tại sao nó mất, bạn sẽ thấy nó ngay lập tức!`;

        document.getElementById("results").innerHTML = "✅ Truy vết hoàn tất!";
        typeEffect(document.getElementById("final"), finalOutput);
    }, 2000);
}
</script>

</body>
  </html>
